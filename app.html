                {["request","followup","clarification"].map(type=>{const e=mkEmail({itemName:"[Item Name]",itemCode:"[Item Code]"},type);return(
                  <div key={type} className="rounded-2xl border border-slate-200 bg-white shadow-sm p-5">
                    <h3 className="text-lg font-semibold text-slate-900 capitalize mb-3">{type}</h3>
                    <p className="text-sm font-medium text-slate-700 mb-2">{e.subject}</p>
                    <pre className="rounded-xl border border-slate-200 bg-slate-50 p-4 text-sm text-slate-700">{e.body}</pre>
                  </div>
                )})}
              </div>
            )}

            <div className="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
              <div className="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
                <div><p className="font-medium text-slate-900">Upload format</p><p className="text-sm text-slate-500">Supports Excel (.xlsx, .xls), CSV, TXT, and TSV with smart status detection</p></div>
                <div className="w-[220px] bg-slate-200 rounded-full h-3"><div className="bg-emerald-500 h-3 rounded-full transition-all" style={{width:met.pct+"%"}}></div></div>
              </div>
            </div>
          </>
        )}
      </div>
      {/* ===== MODALS ===== */}
      <Modal open={uplOpen} onClose={()=>{setUplOpen(false);setDetectedCols([])}} title="Upload Preview - Auto Sorted" wide>
        {detectedCols.length>0&&<div className="rounded-xl bg-slate-50 border border-slate-200 p-3 mb-4"><p className="text-xs font-medium text-slate-700 mb-1">&#128269; Detected columns:</p><div className="flex flex-wrap gap-1">{detectedCols.map((c,i)=><span key={i} className="inline-block px-2 py-0.5 bg-white border border-slate-200 rounded text-xs text-slate-600">{c}</span>)}</div></div>}
        <div className="grid grid-cols-2 md:grid-cols-5 gap-3 mb-4">{STATUSES.map(st=><div key={st} className={"rounded-xl border p-3 "+SPan[st]}><p className="font-medium text-slate-900 text-sm">{st}</p><p className="text-2xl font-semibold">{prev.filter(i=>i.status===st).length}</p></div>)}</div>
        <div className="overflow-x-auto rounded-xl border border-slate-200 mb-4"><table className="w-full text-sm"><thead className="bg-slate-100"><tr><th className="px-3 py-2 text-left">Item</th><th className="px-3 py-2 text-left">Vendor</th><th className="px-3 py-2 text-left">Email</th><th className="px-3 py-2 text-left">Status</th><th className="px-3 py-2 text-left">Priority</th></tr></thead><tbody>{prev.slice(0,50).map(item=><tr key={item.id} className="border-t"><td className="px-3 py-2"><p className="font-medium">{item.itemCode}</p><p className="text-slate-500 text-xs">{item.itemName}</p></td><td className="px-3 py-2">{item.vendor}</td><td className="px-3 py-2">{item.vendorEmail||"Missing"}</td><td className="px-3 py-2"><Badge cls={SC[item.status]}>{item.status}</Badge></td><td className="px-3 py-2"><Badge cls={PrC[item.priority]}>{item.priority}</Badge></td></tr>)}{prev.length>50&&<tr><td colSpan={5} className="px-3 py-2 text-center text-slate-500">{"...and "+(prev.length-50)+" more items"}</td></tr>}</tbody></table></div>
        <div className="flex justify-end gap-2"><Btn variant="outline" onClick={()=>{setUplOpen(false);setDetectedCols([])}}>Cancel</Btn><Btn onClick={doImport}>Import {prev.length} Items</Btn></div>
      </Modal>
      <Modal open={addOpen} onClose={()=>setAddOpen(false)} title="Add SDS Item">
        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
          <input className="rounded-xl border border-slate-200 px-3 py-2 text-sm" placeholder="Item code *" value={ni.itemCode} onChange={e=>setNi({...ni,itemCode:e.target.value})}/>
          <input className="rounded-xl border border-slate-200 px-3 py-2 text-sm" placeholder="Item name *" value={ni.itemName} onChange={e=>setNi({...ni,itemName:e.target.value})}/>
          <input className="rounded-xl border border-slate-200 px-3 py-2 text-sm" placeholder="Vendor *" value={ni.vendor} onChange={e=>setNi({...ni,vendor:e.target.value})}/>
          <input className="rounded-xl border border-slate-200 px-3 py-2 text-sm" placeholder="Vendor email" value={ni.vendorEmail} onChange={e=>setNi({...ni,vendorEmail:e.target.value})}/>
          <input className="rounded-xl border border-slate-200 px-3 py-2 text-sm" placeholder="Owner" value={ni.owner} onChange={e=>setNi({...ni,owner:e.target.value})}/>
          <select className="rounded-xl border border-slate-200 px-3 py-2 text-sm bg-white" value={ni.priority} onChange={e=>setNi({...ni,priority:e.target.value})}>{PRIOS.map(p=><option key={p} value={p}>{p}</option>)}</select>
          <textarea className="md:col-span-2 rounded-xl border border-slate-200 px-3 py-2 text-sm min-h-[80px]" placeholder="Notes" value={ni.notes} onChange={e=>setNi({...ni,notes:e.target.value})}/>
        </div>
        <div className="flex justify-end gap-2"><Btn variant="outline" onClick={()=>setAddOpen(false)}>Cancel</Btn><Btn onClick={addItemFn}>Save Item</Btn></div>
      </Modal>
      <Modal open={compOpen} onClose={()=>setCompOpen(false)} title="Compose Email">
        {active&&<div className="space-y-4">
          <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
            <div className="rounded-xl border border-slate-200 bg-slate-50 p-3"><p className="text-xs uppercase text-slate-500">To</p><p className="mt-1 font-medium text-slate-900 break-all">{active.vendorEmail||"Missing"}</p></div>
            <div className="rounded-xl border border-slate-200 bg-slate-50 p-3"><p className="text-xs uppercase text-slate-500">Item</p><p className="mt-1 font-medium text-slate-900">{active.itemCode+" - "+active.itemName}</p></div>
          </div>
          <div className="flex flex-wrap gap-2">
            {["request","followup","clarification"].map(t=><button key={t} onClick={()=>swapT(t)} className={"px-3 py-1.5 text-sm rounded-xl font-medium "+(eType===t?"bg-slate-900 text-white":"border border-slate-200 text-slate-700 hover:bg-slate-50")}>{t==="followup"?"Follow-Up":t==="clarification"?"Clarification":"Request"}</button>)}
          </div>
          <input className="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm" value={subj} onChange={e=>setSubj(e.target.value)}/>
          <textarea className="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm min-h-[250px]" value={bod} onChange={e=>setBod(e.target.value)}/>
          <div className="flex justify-end gap-2"><Btn variant="outline" onClick={()=>setCompOpen(false)}>Close</Btn><Btn onClick={doQueue}>&#9993; Queue Email</Btn><Btn variant="outline" onClick={function(){openInOutlook(active.vendorEmail,subj,bod)}}>&#128228; Open in Outlook</Btn></div>
        </div>}
      </Modal>
      <Modal open={newProjOpen} onClose={()=>setNewProjOpen(false)} title="Start New Project?">
        <div className="rounded-xl bg-amber-50 border border-amber-200 p-4 mb-4">
          <p className="font-medium text-amber-900">&#9888; This will clear all current items and queued emails.</p>
          <p className="text-sm text-amber-800 mt-1">Save your work first if you want to keep it.</p>
        </div>
        <div className="flex justify-end gap-2">
          <Btn variant="outline" onClick={()=>setNewProjOpen(false)}>Cancel</Btn>
          <Btn variant="outline" onClick={()=>{saveAsFile();setNewProjOpen(false)}}>Save First</Btn>
          <Btn variant="danger" onClick={newProject}>Clear Everything &amp; Start Fresh</Btn>
        </div>
      </Modal>
      <Modal open={dirOpen} onClose={()=>setDirOpen(false)} title="Vendor Email Directory" wide>
        <p className="text-sm text-slate-600 mb-4">Add vendor emails here. They auto-fill when you upload items.</p>
        <div className="flex gap-2 mb-4">
          <input className="flex-1 rounded-xl border border-slate-200 px-3 py-2 text-sm" placeholder="Vendor name" value={dirVendor} onChange={e=>setDirVendor(e.target.value)}/>
          <input className="flex-1 rounded-xl border border-slate-200 px-3 py-2 text-sm" placeholder="Email" value={dirEmail} onChange={e=>setDirEmail(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")addDirEntry()}}/>
          <Btn onClick={addDirEntry}>Add</Btn>
        </div>
        {Object.keys(vendorDir).length>0?<div className="overflow-x-auto rounded-xl border border-slate-200"><table className="w-full text-sm"><thead className="bg-slate-100"><tr><th className="px-3 py-2 text-left">Vendor</th><th className="px-3 py-2 text-left">Email</th><th className="px-3 py-2 text-right">Action</th></tr></thead><tbody>{Object.entries(vendorDir).sort().map(function(pair){return <tr key={pair[0]} className="border-t"><td className="px-3 py-2 font-medium">{pair[0]}</td><td className="px-3 py-2 text-slate-600">{pair[1]}</td><td className="px-3 py-2 text-right"><Btn size="sm" variant="outline" onClick={function(){removeDirEntry(pair[0])}}>Remove</Btn></td></tr>})}</tbody></table></div>:<p className="text-center py-8 text-slate-400">No vendors yet.</p>}
      </Modal>
      <Modal open={mapOpen} onClose={function(){setMapOpen(false);setUplOpen(true)}} title="Map Your Columns" wide>
        <p className="text-sm text-slate-600 mb-4">Match columns to fields or leave as Auto.</p>
        <div className="grid gap-3 mb-4">{Object.entries(FIELD_LABELS).map(function(pair){return <div key={pair[0]} className="flex items-center gap-3"><label className="w-36 text-sm font-medium text-slate-700">{pair[1]}</label><select className="flex-1 rounded-xl border border-slate-200 px-3 py-2 text-sm bg-white" value={colMap[pair[0]]||"auto"} onChange={function(e){setColMap(function(prev){var n=Object.assign({},prev);n[pair[0]]=e.target.value;return n})}}><option value="auto">Auto (recommended)</option>{rawCols.map(function(col,ci){return <option key={ci} value={col}>{col}</option>})}</select></div>})}</div>
        <div className="flex justify-end gap-2"><Btn variant="outline" onClick={function(){setMapOpen(false);setUplOpen(true)}}>Skip</Btn><Btn onClick={applyMapping}>Apply Mapping</Btn></div>
      </Modal>
      <Modal open={bulkOpen} onClose={function(){setBulkOpen(false)}} title="Bulk Email by Vendor" wide>
        {!bulkVendor?<div>
          <p className="text-sm text-slate-600 mb-4">Select a vendor to send one email covering all their outstanding items.</p>
          {vendorGroups.length>0?<div className="space-y-2">{vendorGroups.map(function(g){return <div key={g.vendor} className="flex items-center justify-between rounded-xl border border-slate-200 p-3 hover:bg-slate-50"><div><p className="font-medium text-slate-900">{g.vendor}</p><p className="text-xs text-slate-500">{g.items.length+" items need SDS"}{g.email?" \u2022 "+g.email:""}</p></div><Btn size="sm" onClick={function(){openBulk(g)}}>{g.email?"Compose":"Need Email"}</Btn></div>})}</div>:<p className="text-center py-8 text-slate-400">No outstanding items.</p>}
        </div>:<div className="space-y-4">
          <div className="flex items-center gap-2 mb-2"><Btn size="sm" variant="outline" onClick={function(){setBulkVendor(null)}}>{"\u2190 Back"}</Btn><p className="font-medium text-slate-900">{bulkVendor.vendor+" ("+bulkVendor.items.length+" items)"}</p></div>
          <div className="rounded-xl border border-slate-200 bg-slate-50 p-3"><p className="text-xs uppercase text-slate-500">To</p><p className="mt-1 font-medium text-slate-900">{bulkVendor.email}</p></div>
          <div><label className="text-sm font-medium text-slate-700">Subject</label><input className="w-full mt-1 rounded-xl border border-slate-200 px-3 py-2 text-sm" value={bulkSubj} onChange={function(e){setBulkSubj(e.target.value)}}/></div>
          <div><label className="text-sm font-medium text-slate-700">Body</label><textarea className="w-full mt-1 rounded-xl border border-slate-200 px-3 py-2 text-sm" rows={12} value={bulkBod} onChange={function(e){setBulkBod(e.target.value)}}/></div>
          <div className="flex justify-end gap-2"><Btn variant="outline" onClick={function(){setBulkOpen(false)}}>Cancel</Btn><Btn onClick={doBulkQueue}>Queue Bulk Email</Btn><Btn variant="outline" onClick={function(){openInOutlook(bulkVendor.email,bulkSubj,bulkBod)}}>&#128228; Open in Outlook</Btn></div>
        </div>}
      </Modal>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
