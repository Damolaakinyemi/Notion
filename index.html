<script type="text/babel">
const {useState,useMemo,useRef,useEffect,useCallback}=React;
const SUPA_URL="https://hlceoxvmgeymdmprrobx.supabase.co";
const SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhsY2VveHZtZ2V5bWRtcHJyb2J4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMTE0NzYsImV4cCI6MjA5NjU4NzQ3Nn0.zc1h0-AoFt89S-gbVxda5QcDnR-eoH7GgZ1glzCsaKQ";
const supa=window.supabase.createClient(SUPA_URL,SUPA_KEY);
emailjs.init("JQVKZHu7BEcEBEQdF");

async function cloudSaveItems(userId,items){
  if(!userId||!items.length)return;
  const rows=items.map(it=>({id:it.id,user_id:userId,item_name:it.itemName,item_code:it.itemCode,vendor:it.vendor,vendor_email:it.vendorEmail,owner:it.owner,status:it.status,priority:it.priority,notes:it.notes,document_name:it.documentName,follow_up:it.followUpDate,last_contact:it.lastContact,due_date:it.followUpDate,updated_at:new Date().toISOString()}));
  await supa.from("items").delete().eq("user_id",userId);
  const batch=[];for(let i=0;i<rows.length;i+=500)batch.push(rows.slice(i,i+500));
  for(const b of batch)await supa.from("items").insert(b);
}

async function cloudLoadItems(userId){
  if(!userId)return null;
  const{data,error}=await supa.from("items").select("*").eq("user_id",userId).order("id");
  if(error||!data||!data.length)return null;
  return data.map(r=>({id:r.id,itemCode:r.item_code||"",itemName:r.item_name||"",vendor:r.vendor||"",vendorEmail:r.vendor_email||"",owner:r.owner||"",status:r.status||"Not Finished",priority:r.priority||"Medium",notes:r.notes||"",documentName:r.document_name||"",followUpDate:r.follow_up||"",lastContact:r.last_contact||""}));
}

function AuthGate({children}){
  const[user,setUser]=useState(null);
  const[loading,setLoading]=useState(true);
  const[mode,setMode]=useState("login");
  const[email,setEmail]=useState("");
  const[pass,setPass]=useState("");
  const[err,setErr]=useState("");
  const[msg,setMsg]=useState("");
  const[busy,setBusy]=useState(false);

  useEffect(()=>{
    supa.auth.getSession().then(({data:{session}})=>{setUser(session?.user||null);setLoading(false)});
    const{data:{subscription}}=supa.auth.onAuthStateChange((_,session)=>{setUser(session?.user||null)});
    return()=>subscription.unsubscribe();
  },[]);

  if(loading)return <div className="auth-wrap"><div className="auth-card" style={{textAlign:"center"}}><div style={{fontSize:"2rem",marginBottom:"12px"}}>&#9889;</div><p>Loading...</p></div></div>;
  if(user)return children(user);

  const doAuth=async(e)=>{
    e.preventDefault();setErr("");setMsg("");setBusy(true);
    if(mode==="login"){
      const{error}=await supa.auth.signInWithPassword({email,password:pass});
      if(error)setErr(error.message);
    }else{
      const{error}=await supa.auth.signUp({email,password:pass});
      if(error)setErr(error.message);
      else setMsg("Check your email to confirm, then log in!");
    }
    setBusy(false);
  };

  return(
    <div className="auth-wrap">
      <div className="auth-card">
        <div style={{textAlign:"center",fontSize:"2.5rem",marginBottom:"8px"}}>&#9889;</div>
        <h1>Notion</h1>
        <p className="auth-sub">{mode==="login"?"Sign in to your account":"Create a new account"}</p>
        {err&&<div className="auth-err">{err}</div>}
        {msg&&<div className="auth-msg">{msg}</div>}
        <form onSubmit={doAuth}>
          <input type="email" placeholder="Email address" value={email} onChange={e=>setEmail(e.target.value)} required/>
          <input type="password" placeholder="Password" value={pass} onChange={e=>setPass(e.target.value)} required minLength={6}/>
          <button type="submit" className="auth-btn" disabled={busy}>{busy?"Please wait...":mode==="login"?"Sign In":"Sign Up"}</button>
        </form>
        <div className="auth-toggle">{mode==="login"?<span>No account? <button onClick={()=>{setMode("signup");setErr("");setMsg("")}}>Sign up</button></span>:<span>Have an account? <button onClick={()=>{setMode("login");setErr("");setMsg("")}}>Sign in</button></span>}</div>
      </div>
    </div>
  );
}

const NL=String.fromCharCode(10);
const SPLIT=new RegExp(String.fromCharCode(13)+"?"+String.fromCharCode(10));
const getDate=()=>new Date().toISOString().slice(0,10);
const getTime=()=>new Date().toLocaleString();
const STATUSES=["Not Finished","In Progress","Needs Attention","Completed"];
const PRIOS=["Low","Medium","High","Urgent"];
const STORE_KEY="sds_manager_project";
const TOUR_KEY="sds_manager_tour_seen";

const SC={"Not Finished":"bg-slate-100 text-slate-700 border border-slate-200","In Progress":"bg-amber-100 text-amber-800 border border-amber-200","Needs Attention":"bg-rose-100 text-rose-800 border border-rose-200","Completed":"bg-emerald-100 text-emerald-800 border border-emerald-200"};
const SPan={"Not Finished":"border-slate-200 bg-slate-50","In Progress":"border-amber-200 bg-amber-50","Needs Attention":"border-rose-200 bg-rose-50","Completed":"border-emerald-200 bg-emerald-50"};
const PrC={"Low":"bg-slate-100 text-slate-700 border border-slate-200","Medium":"bg-blue-100 text-blue-700 border border-blue-200","High":"bg-orange-100 text-orange-700 border border-orange-200","Urgent":"bg-red-100 text-red-700 border border-red-200"};

function loadSaved(){try{const d=localStorage.getItem(STORE_KEY);if(d){return JSON.parse(d)}}catch(e){}return null}
function saveToStorage(data){try{localStorage.setItem(STORE_KEY,JSON.stringify(data))}catch(e){}}
function isTourSeen(){try{return!!localStorage.getItem(TOUR_KEY)}catch(e){return false}}
function markTourSeen(){try{localStorage.setItem(TOUR_KEY,"1")}catch(e){}}

function has(s,sub){return s.indexOf(sub)>=0}
function topId(a){let m=0;a.forEach(x=>{if(x.id>m)m=x.id});return m}
function norm(s){return String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"")}

const COMP_WORDS=["yes","y","x","done","complete","completed","received","found","onfile","have","obtained","true","ok","good","got","gotit","haveit","archived","filed"];
const PROG_WORDS=["pending","requested","sent","emailed","contacted","inprogress","followup","following","waiting","awaiting"];
const ATTN_WORDS=["notfound","missing","discontinued","unavailable","issue","error","problem","noresponse","noreply","dead","outofstock","backordered"];
const YES_RE=/^(yes|y|x|true|1|ok|done|complete|completed|received|found|have|obtained|good)$/i;

const CODE_KEYS=["itemcode","code","sku","itemnumber","itemno","item","internalid","no","number","acmecode","acme","catalog","catalognumber","part","partnumber","upc","itemnum","plu","id"];
const NAME_KEYS=["displayname","itemname","name","description","desc","itemdescription","productdescription","productname","product","title","chemical","chemicalname"];
const VEND_KEYS=["preferredvendor","vendor","supplier","manufacturer","mfg","mfr","manufacturername","suppliername","company","brand","vendorname"];
const EMAIL_KEYS=["vendoremail","email","supplieremail","manufactureremail","contactemail","emailaddress","contact"];
const STATUS_KEYS=["sdsavailable","status","sdsstatus","stage","state","sds","sdsonfile","sdsfound","sdsreceived","havesds","received","complete","completed","done","onfile","found"];
const PROG_KEYS=["requested","sent","emailed","contacted","datesent","daterequested","lastemail","lastcontact","lastsent","followup"];
const DOC_KEYS=["documentname","document","file","sdsfile","filename","filepath","sdsdocument","sdsfilename","attachment"];
const NOTE_KEYS=["notes","note","comments","comment","remarks","details","info"];
const OWNER_KEYS=["owner","assignedto","buyer","assignee","rep","person","who","team"];
const PRIO_KEYS=["priority","urgency","level","importance"];
const DATE_KEYS=["receiveddate","datereceived","sdsdate","dateadded","datecompleted","completeddate","donedate"];

function pick(row,keyList,fb){for(const k of keyList){const v=row[k];if(v!=null&&String(v).trim())return String(v).trim()}return fb||""}
function isYes(v){const s=String(v||"").trim();if(!s)return false;return YES_RE.test(s)}
function isDate(v){const s=String(v||"").trim();if(!s)return false;if(/\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}/.test(s))return true;if(/\d{4}-\d{2}-\d{2}/.test(s))return true;if(/\d{5}/.test(s)&&!has(s," "))return true;return false}

function autoSt(row){
  var skeys=["sdsavailable","status","sdsstatus","stage","state","sds","sdsonfile","sdsfound","sdsreceived","havesds","received","complete","completed","done","onfile","found"];
  var dkeys=["documentname","document","file","sdsfile","filename","filepath","sdsdocument","sdsfilename","attachment"];
  var skip=["","no","n","false","0","none","n/a","na","not yet","notyet","missing","unavailable"];
  for(var i=0;i<skeys.length;i++){var sv=row[skeys[i]];if(sv==null)continue;var sc=String(sv).toLowerCase().replace(/\s+/g," ").trim();if(!sc||skip.indexOf(sc)>=0)continue;if(sc==="yes"||sc==="y"||sc==="x"||sc==="true"||sc==="1"||sc.indexOf("complete")>=0||sc.indexOf("received")>=0||sc.indexOf("on file")>=0||sc.indexOf("have sds")>=0||sc.indexOf("archived")>=0||sc.indexOf("substitute")>=0)return"Completed";if(sc.indexOf("requested")>=0||sc.indexOf("pending")>=0||sc.indexOf("emailed")>=0||sc.indexOf("waiting")>=0||sc.indexOf("follow")>=0||sc.indexOf("contacted")>=0)return"In Progress";}
  for(var j=0;j<dkeys.length;j++){var dv=row[dkeys[j]];if(dv==null)continue;var dc=String(dv).toLowerCase().trim();if(dc&&skip.indexOf(dc)<0&&dc.length>2)return"Completed";}
  var ft=Object.values(row||{}).join(" ").toLowerCase();
  if(ft.indexOf("https://")>=0)return"Completed";
  if(ft.indexOf("requested")>=0||ft.indexOf("emailed")>=0||ft.indexOf("waiting")>=0||ft.indexOf("follow")>=0||ft.indexOf("pending")>=0||ft.indexOf("contacted")>=0)return"In Progress";
  if(ft.indexOf("missing")>=0||ft.indexOf("not found")>=0||ft.indexOf("no response")>=0||ft.indexOf("dead chemical")>=0||ft.indexOf("discontinued")>=0||ft.indexOf("no verifiable")>=0)return"Needs Attention";
  return"Not Finished";
}
function autoPr(row,st){const r=pick(row,PRIO_KEYS,"");if(PRIOS.indexOf(r)>=0)return r;if(st==="Needs Attention")return"Urgent";const n=pick(row,NOTE_KEYS,"").toLowerCase();if(has(n,"urgent")||has(n,"asap")||has(n,"critical"))return"Urgent";if(has(n,"chemical")||has(n,"herbicide")||has(n,"hazard"))return"High";return"Medium"}

function splitRow(line,d){const out=[];let cur="";let q=false;for(let i=0;i<line.length;i++){const c=line[i];const nx=line[i+1]||"";if(c==='"'&&q&&nx==='"'){cur+='"';i++}else if(c==='"')q=!q;else if(c===d&&!q){out.push(cur.trim());cur=""}else cur+=c}out.push(cur.trim());return out}

function parseCsv(text){
  const s=String(text||"").trim();if(!s)return{rows:[],cols:[]};
  const d=has(s,"\t")?"\t":",";
  const lines=s.split(SPLIT).filter(l=>l.trim());if(!lines.length)return{rows:[],cols:[]};
  const raw=splitRow(lines[0],d);const hdr=raw.map(h=>h.toLowerCase().replace(/[^a-z0-9]/g,""));const origHdr=raw.map(h=>h.trim());
  const allKnown=[...CODE_KEYS,...NAME_KEYS,...VEND_KEYS,...EMAIL_KEYS,...STATUS_KEYS,...PROG_KEYS,...DOC_KEYS,...NOTE_KEYS,...OWNER_KEYS,...PRIO_KEYS,...DATE_KEYS];
  const isH=hdr.some(h=>allKnown.indexOf(h)>=0)||hdr.some(h=>has(h,"item")||has(h,"vendor")||has(h,"sds")||has(h,"product")||has(h,"code")||has(h,"name")||has(h,"status")||has(h,"desc"));
  const data=isH?lines.slice(1):lines;
  const cols=isH?hdr:["col0","col1","col2","col3","col4","col5","col6","col7","col8","col9"];
  const rows=data.map(line=>{const cells=splitRow(line,d);const row={};cols.forEach((c,i)=>{row[c]=cells[i]||""});return row});
  return{rows,cols:isH?origHdr:cols};
}

function mapRows(rows,off){return rows.map((row,i)=>{const st=autoSt(row);return{id:off+i+1,itemCode:pick(row,CODE_KEYS,"UPLOAD-"+(off+i+1)),itemName:pick(row,NAME_KEYS,"Uploaded Item"),vendor:pick(row,VEND_KEYS,"Unknown Vendor"),vendorEmail:pick(row,EMAIL_KEYS,""),status:st,priority:autoPr(row,st),lastContact:pick(row,[...PROG_KEYS,"lastcontact","lastsent"],""),owner:pick(row,OWNER_KEYS,"Team"),documentName:pick(row,DOC_KEYS,""),notes:pick(row,NOTE_KEYS,"Imported."),followUpDate:""}}).map(function(item){if(!item.vendorEmail&&typeof lookupVendorEmail==="function"){item.vendorEmail=lookupVendorEmail(item.vendor)}return item})}

function mkEmail(item,type){
  const nm=item.itemName||"[Item Name]";const cd=item.itemCode||"[Item Code]";const lb=nm+" ("+cd+")";
  const j=a=>a.join(NL);
  if(type==="followup")return{subject:"Follow-Up: SDS Request - "+nm,body:j(["Hello,","","Following up on my prior request for the SDS for:","","Item: "+lb,"","If available, please share the current SDS or let us know about any replacement.","","Thank you."])};
  if(type==="clarification")return{subject:"Clarification: SDS Request - "+nm,body:j(["Hello,","","Could you confirm the SDS applies specifically to:","","Item: "+lb,"","If there is a more current SDS or updated product code, please share.","","Thank you."])};
  return{subject:"Request for SDS - "+nm,body:j(["Hello,","","Please provide the most current Safety Data Sheet (SDS) for:","","Item: "+lb,"","If renamed, discontinued, or replaced, please include updated product info.","","Thank you for your assistance."])};
}

function openInOutlook(to,subject,body){var ml="mailto:"+encodeURIComponent(to||"")+"?subject="+encodeURIComponent(subject||"")+"&body="+encodeURIComponent(body||"");window.location.href=ml;}

function readExcel(arrayBuffer){try{const wb=XLSX.read(arrayBuffer,{type:"array"});const wsName=wb.SheetNames[0];const ws=wb.Sheets[wsName];return XLSX.utils.sheet_to_csv(ws)}catch(e){return null}}

function Badge({children,cls}){return <span className={"inline-block px-2.5 py-0.5 text-xs font-medium rounded-full "+cls}>{children}</span>}

function Modal({open,onClose,title,children,wide}){
  const ref=useRef();
  useEffect(()=>{if(open)ref.current?.showModal();else ref.current?.close()},[open]);
  return <dialog ref={ref} onClose={onClose} className={"rounded-2xl p-0 "+(wide?"w-[900px] max-w-[95vw]":"w-[640px] max-w-[95vw]")} style={{maxHeight:"85vh",overflow:"auto"}}>
    <div className="p-6">
      <div className="flex items-center justify-between mb-4"><h2 className="text-xl font-semibold text-slate-900">{title}</h2><button onClick={onClose} className="text-slate-400 hover:text-slate-700 text-2xl leading-none">&times;</button></div>
      {children}
    </div>
  </dialog>
}

function Tour({open,onClose}){
  const[step,setStep]=useState(0);
  const s=TOUR_STEPS[step];
  const isLast=step===TOUR_STEPS.length-1;
  const isFirst=step===0;
  const close=()=>{markTourSeen();setStep(0);onClose()};
  if(!open)return null;
  return(
    <div className="fixed inset-0 z-50 flex items-center justify-center" style={{background:"rgba(0,0,0,0.5)"}}>
      <div className="tour-fade bg-white rounded-3xl shadow-2xl w-[580px] max-w-[95vw] overflow-hidden" key={step}>
        <div className="bg-gradient-to-r from-indigo-600 via-blue-600 to-indigo-500 px-8 pt-8 pb-6 text-white">
          <div className="flex items-center justify-between mb-1">
            <span className="text-sm font-medium opacity-80">{"Step "+(step+1)+" of "+TOUR_STEPS.length}</span>
            {!isLast&&<button onClick={close} className="text-sm opacity-70 hover:opacity-100 transition-opacity">Skip tutorial</button>}
          </div>
          <div className="text-4xl mt-3 mb-2">{s.icon}</div>
          <h2 className="text-2xl font-semibold">{s.title}</h2>
        </div>
        <div className="px-8 py-6">
          <p className="text-slate-700 leading-relaxed">{s.desc}</p>
          {s.bullets&&<ul className="mt-4 space-y-2">{s.bullets.map((b,i)=><li key={i} className="flex items-start gap-2 text-sm text-slate-600"><span className="text-indigo-500 mt-0.5 font-bold">&bull;</span><span>{b}</span></li>)}</ul>}
          {s.tip&&<div className="mt-4 rounded-xl bg-indigo-50 border border-indigo-100 px-4 py-3 text-sm text-indigo-800"><span className="font-medium">{"\uD83D\uDCA1"} Tip: </span>{s.tip}</div>}
        </div>
        <div className="px-8 pb-6 flex items-center justify-between">
          <div className="flex gap-1.5">{TOUR_STEPS.map((_,i)=><div key={i} className={"w-2.5 h-2.5 rounded-full transition-colors "+(i===step?"bg-indigo-600":"bg-slate-200")}/>)}</div>
          <div className="flex gap-2">
            {!isFirst&&<button onClick={()=>setStep(step-1)} className="px-5 py-2.5 rounded-xl text-sm font-medium border border-slate-200 text-slate-700 hover:bg-slate-50 transition-colors">Back</button>}
            {isLast?<button onClick={close} className="px-6 py-2.5 rounded-xl text-sm font-medium bg-indigo-600 text-white hover:bg-indigo-700 transition-colors">Get Started</button>
            :<button onClick={()=>setStep(step+1)} className="px-5 py-2.5 rounded-xl text-sm font-medium bg-indigo-600 text-white hover:bg-indigo-700 transition-colors">Next</button>}
          </div>
        </div>
      </div>
    </div>
  );
}

        <p className="text-sm text-slate-600 mb-4">Match columns to fields or leave as Auto.</p>
        <div className="grid gap-3 mb-4">{Object.entries(FIELD_LABELS).map(function(pair){return <div key={pair[0]} className="flex items-center gap-3"><label className="w-36 text-sm font-medium text-slate-700">{pair[1]}</label><select className="flex-1 rounded-xl border border-slate-200 px-3 py-2 text-sm bg-white" value={colMap[pair[0]]||"auto"} onChange={function(e){setColMap(function(prev){var n=Object.assign({},prev);n[pair[0]]=e.target.value;return n})}}><option value="auto">Auto (recommended)</option>{rawCols.map(function(col,ci){return <option key={ci} value={col}>{col}</option>})}</select></div>})}</div>
        <div className="flex justify-end gap-2"><Btn variant="outline" onClick={function(){setMapOpen(false);setNotice("Using auto-detected columns.");setUplOpen(true)}}>Skip</Btn><Btn onClick={applyMapping}>Apply Mapping</Btn></div>
      </Modal>

      <Modal open={bulkOpen} onClose={function(){setBulkOpen(false)}} title="Bulk Email by Vendor" wide>
        {!bulkVendor?<div>
          <p className="text-sm text-slate-600 mb-4">Select a vendor to send one email covering all their outstanding items.</p>
          {vendorGroups.length>0?<div className="space-y-2">{vendorGroups.map(function(g){return <div key={g.vendor} className="flex items-center justify-between rounded-xl border border-slate-200 p-3 hover:bg-slate-50"><div><p className="font-medium text-slate-900">{g.vendor}</p><p className="text-xs text-slate-500">{g.items.length+" items need SDS"}{g.email?" \u2022 "+g.email:""}</p></div><Btn size="sm" onClick={function(){openBulk(g)}}>{g.email?"Compose":"Need Email"}</Btn></div>})}</div>:<p className="text-center py-8 text-slate-400">No outstanding items. All completed!</p>}
        </div>:<div className="space-y-4">
          <div className="flex items-center gap-2 mb-2"><Btn size="sm" variant="outline" onClick={function(){setBulkVendor(null)}}>\u2190 Back</Btn><p className="font-medium text-slate-900">{bulkVendor.vendor+" ("+bulkVendor.items.length+" items)"}</p></div>
          <div className="rounded-xl border border-slate-200 bg-slate-50 p-3"><p className="text-xs uppercase text-slate-500">To</p><p className="mt-1 font-medium text-slate-900">{bulkVendor.email}</p></div>
          <div><label className="text-sm font-medium text-slate-700">Subject</label><input className="w-full mt-1 rounded-xl border border-slate-200 px-3 py-2 text-sm" value={bulkSubj} onChange={function(e){setBulkSubj(e.target.value)}}/></div>
          <div><label className="text-sm font-medium text-slate-700">Body</label><textarea className="w-full mt-1 rounded-xl border border-slate-200 px-3 py-2 text-sm" rows={12} value={bulkBod} onChange={function(e){setBulkBod(e.target.value)}}/></div>
          <div className="rounded-xl bg-indigo-50 border border-indigo-200 p-3"><p className="text-xs font-medium text-indigo-800 mb-1">{"Items included ("+bulkVendor.items.length+")"}</p><div className="max-h-40 overflow-y-auto text-xs text-indigo-700">{bulkVendor.items.map(function(it){return <p key={it.id}>{it.itemCode+" - "+it.itemName}</p>})}</div></div>
          <div className="flex justify-end gap-2"><Btn variant="outline" onClick={function(){setBulkOpen(false)}}>Cancel</Btn><Btn onClick={doBulkQueue}>Queue Bulk Email</Btn><Btn variant="outline" onClick={function(){openInOutlook(bulkVendor.email,bulkSubj,bulkBod)}}>&#128228; Open in Outlook</Btn></div>
        </div>}
      </Modal>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<AuthGate>{(user)=><App user={user}/>}</AuthGate>);
</script>
</body>
</html>
